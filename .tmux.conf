# ==========
# .TMUX.CONF
# ==========

# Reload config
unbind r
bind r source-file ~/.tmux.conf

# Help: cheatsheet popup (prefix ?), raw key list moved to prefix /
bind ? display-popup -E -w 72 -h 90% "less -R ~/.dotfiles/.config/tmux/help.txt"
bind / list-keys

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# Don't rename windows automatically
set-option -g allow-rename off

setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Start windows count from 1
set -g base-index 1
setw -g pane-base-index 1

# Don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# =====
# THEME
# =====

# Truecolor support for better color themes
set-option -ga terminal-overrides ',xterm-256color:Tc'

# Allow passthrough for image protocols (required for image.nvim)
set -g allow-passthrough on

# Increase tmux message limit
set-option -g history-limit 50000

# ===========
# STATUS BAR
# ===========

# Status bar colors based on Gruvbox Dark Hard theme
# Background: #1d2021 (very dark gray/black)
# Foreground: #ebdbb2 (light gray)
# Selection: #665c54 (dark gray)
# Accent: #cc241d (red), #98971a (green), #d79921 (yellow), #458588 (blue)

# Status bar style
set -g status-style bg="#3D3836",fg="#ebdbb2"

# Status left (session info)
set -g status-left-length 80
set -g status-left-style bg="#3D3836",fg="#ebdbb2"
set -g status-left "#[default]#[bg=#665c54,fg=#ebdbb2,bold] #S #[default]#[bg=#3c3836,fg=#665c54] #{?client_prefix,#[fg=#fb4934]●#[fg=#665c54],○}#{?window_zoomed_flag,#[fg=#fe8019] ZOOM,}#{?pane_in_mode,#[fg=#fabd2f] COPY,} #[default]"

# Status right (time, date, etc.)
set -g status-right-length 180
set -g status-right-style bg="#3D3836",fg="#ebdbb2"
set -g status-right "#[default]#[fg=#d3869b,bold] #(~/.dotfiles/.config/tmux/gitinfo.sh \"#{pane_current_path}\") #[default]#{?#{b:pane_current_path},#[fg=#a89984#,italics] #{b:pane_current_path} ,}#[default]#[fg=#83a598] #(~/.dotfiles/.config/tmux/weather.sh) #[default]#[fg=#fabd2f] #(~/.dotfiles/.config/tmux/suntimes.sh) #[default]#[bg=#32302f] W%V #[default]#[bg=#45403d] %A #[default]#[bg=#504945] %d %b %Y #[default]#[bg=#fe8019,fg=#282828] #(~/.dotfiles/.config/tmux/timeofday.sh) %H:%M #[default]"

# Window status style
setw -g window-status-style "bg=#3D3836,fg=#928374"
setw -g window-status-current-style "bg=#fe8019,fg=#282828"
setw -g window-status-format " #[fg=#fabd2f,bold]#I#[fg=#928374,nobold] #W "
setw -g window-status-current-format " #[fg=#282828,bold]#I#[nobold] #[fg=#3c2f12]#W "

# Window status separator
setw -g window-status-separator ""

# Pane border colors
set -g pane-border-style bg="#3D3836",fg="#665c54"
set -g pane-active-border-style bg="#3D3836",fg="#ebdbb2"

# Message text
set -g message-style bg="#d79921",fg="#282828"

# Mode indicator
set -g mode-style bg="#d79921",fg="#282828"

# =======
# PLUGINS
# =======

# https://github.com/tmux-plugins/tpm
# <C-B> I: install plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
# tmux-fzf: fuzzy menu for sessions/windows/panes/keybinds (prefix + F)
set -g @plugin 'sainnhe/tmux-fzf'
# tmux-which-key: press prefix + Space for a popup menu of all actions
set -g @plugin 'alexwforsythe/tmux-which-key'

# Enable automatic restore
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
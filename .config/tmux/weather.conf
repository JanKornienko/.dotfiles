# Pinned location for the tmux weather and sun-time segments.
#
# Without this, weather.sh asks ip-api.com where the *host* is. That resolves to
# wherever the machine's traffic leaves from: the laptop reported Prague
# (50.0883 14.4124) while a Coder workspace reported its datacenter in Nuremberg
# (49.4543 11.0746). Same config, sunrise and sunset off by about 15 minutes.
#
# Pinning the coordinates makes every host agree. Checked against both providers
# at these coordinates -- open-meteo and wttr.in return the same minute -- so it
# no longer matters which one a host can reach.
#
# Leave WEATHER_LATLON empty to fall back to IP detection.
# Per-host override (travel, a different office): create
# ~/.config/tmux/weather.local.conf and set WEATHER_LATLON there; it is sourced
# after this file and is not tracked.

WEATHER_LATLON="50.0883 14.4124"   # Prague
